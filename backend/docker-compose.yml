services:
  redis:
    container_name: redis
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
  django:
    container_name: django
    build: .
    volumes:
      - .:/app
      - media:/app/media
    environment:
      - UV_PROJECT_ENVIRONMENT=/venv
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: >
      bash -c "uv run manage.py migrate &&
      uv run manage.py runserver 0.0.0.0:8000"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
  celery:
    container_name: celery
    build: .
    command: uv run celery -A core worker -l info
    volumes:
      - .:/app
      - media:/app/media
    environment:
      - UV_PROJECT_ENVIRONMENT=/venv
    env_file:
      - .env
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
      django:
        condition: service_started
  postgresql:
    image: postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    env_file:
      - .env
    volumes:
      - postgresdb:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 1s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
volumes:
  postgresdb:
  media:
